services:
  - type: web
    name: vjk-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vjk-db
          property: connectionString
      - key: DATA_DIR
        value: /data/vjk
      - key: PORT
        value: 8000

databases:
  - name: vjk-db
    plan: free
    databaseName: vjk
    user: vjk
