<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VJK Dashboard</title><style>body{margin:0;font-family:Inter,system-ui;background:#0b1020;color:#e8ecf7}aside{position:fixed;width:230px;top:0;bottom:0;background:#11182b;padding:22px}.brand{font-size:24px;font-weight:800;margin-bottom:30px}.nav button{display:block;width:100%;padding:12px;margin:5px 0;background:transparent;border:0;color:#aeb8d0;text-align:left;border-radius:8px}.nav button:hover{background:#202b46;color:white}main{margin-left:230px;padding:28px}.card{background:#141d33;border:1px solid #293653;border-radius:12px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.metric{font-size:28px;font-weight:700}input,select{background:#0d1426;color:white;border:1px solid #34415f;padding:10px;border-radius:7px}.primary{background:#5b6cff;color:white;border:0;padding:10px 14px;border-radius:7px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #293653;padding:10px;text-align:left;white-space:nowrap}small{color:#8794b3}</style></head><body><aside><div class="brand">VJK</div><div class="nav"><button onclick="overview()">▦ Overview</button><button onclick="database()">▤ Database</button><button onclick="auth()">♙ Auth</button><button onclick="storage()">◫ Storage</button><button onclick="realtime()">◉ Realtime</button><button onclick="keys()">⚿ API Keys</button><button onclick="projects()">⌘ Projects</button></div></aside><main id="app"></main><script>const key=localStorage.vjkKey||'vjk-dev-key';const api=(p,o={})=>fetch(p,{...o,headers:{'x-api-key':key,...(o.headers||{})}}).then(r=>r.json());const shell=(t,b)=>app.innerHTML='<h1>'+t+'</h1>'+b;async function overview(){let[t,p]=await Promise.all([api('/api/tables'),api('/api/projects')]);shell('Overview','<div class="grid"><div class="card"><small>Database tables</small><div class="metric">'+t.tables.length+'</div></div><div class="card"><small>Projects</small><div class="metric">'+p.projects.length+'</div></div><div class="card"><small>Realtime</small><div class="metric">ONLINE</div></div></div><div class="card"><h3>VJK Backend</h3><p>PostgreSQL · JWT Auth · REST · Storage · WebSockets</p></div>')}async function database(){let x=await api('/api/tables');shell('Database','<div class="card"><input id="newtable" placeholder="new table name"> <button class="primary" onclick="createTable()">Create table</button><br><br><select id="tbl">'+x.tables.map(t=>'<option>'+t+'</option>').join('')+'</select> <button class="primary" onclick="loadRows()">Open table</button><div id="rows"></div></div>');loadRows()}async function createTable(){await api('/api/tables',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:newtable.value})});database()}async function loadRows(){let t=tbl.value,r=await api('/api/tables/'+encodeURIComponent(t)+'/rows'),c=r.rows.length?Object.keys(r.rows[0]):[];rows.innerHTML='<div class="tablewrap"><table><tr>'+c.map(x=>'<th>'+x+'</th>').join('')+'</tr>'+r.rows.map(x=>'<tr>'+c.map(k=>'<td>'+String(x[k]??'')+'</td>').join('')+'</tr>').join('')+'</table></div>'}function auth(){shell('Auth','<div class="card"><h3>Real user registration & login</h3><p><code>POST /auth/signup</code> and <code>POST /auth/login</code>. Passwords use bcrypt and sessions use JWT.</p></div>')}async function storage(){let x=await api('/api/storage/default');shell('Storage','<div class="card"><input type="file" id="file"> <button class="primary" onclick="upload()">Upload</button><div>'+x.files.map(f=>'<p>'+f.path+' · '+f.size+' bytes</p>').join('')+'</div></div>')}async function upload(){let f=file.files[0],d=new FormData();d.append('file',f);await fetch('/api/storage/default',{method:'POST',headers:{'x-api-key':key},body:d});storage()}function realtime(){shell('Realtime','<div class="card"><p>WebSocket: <code>/realtime?apikey=YOUR_KEY</code></p><pre id="events">Waiting…</pre></div>');let w=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/realtime?apikey='+encodeURIComponent(key));w.onmessage=e=>events.textContent+='\n'+e.data}async function keys(){let x=await api('/api/keys');shell('API Keys','<div class="card"><input id="kn" placeholder="Key name"> <button class="primary" onclick="createKey()">Create API key</button><div>'+x.keys.map(k=>'<p>'+k.name+' · '+k.key_prefix+'… · '+k.created_at+' <button onclick="revokeKey(\''+k.id+'\')">Revoke</button></p>').join('')+'</div></div>')}async function createKey(){let x=await api('/api/keys',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:kn.value})});alert('Copy this key now: '+x.key);keys()}async function revokeKey(id){await api('/api/keys/'+id,{method:'DELETE'});keys()}async function projects(){let x=await api('/api/projects');shell('Projects','<div class="card"><input id="pn" placeholder="Project name"> <button class="primary" onclick="newProject()">Create</button>'+x.projects.map(p=>'<p>'+p.name+' <small>'+p.id+'</small></p>').join('')+'</div>')}async function newProject(){await api('/api/projects',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:pn.value})});projects()}overview();</script></body></html>
